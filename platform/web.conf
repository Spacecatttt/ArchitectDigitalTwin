# Вебсервер подання: моделі WoT, вебінтерфейс, 3D-сцена (ЛР 3) і API Ditto лише для читання
server {
    listen 80;

    location /twin/ {
        root /usr/share/nginx/html;
        types { application/tm+json jsonld; application/json json; text/turtle ttl; }
    }

    location /ui/ {
        root /usr/share/nginx/html;
    }

    location /scene/ {            # 3D-сцена: код і дані стискаються gzip
        root /usr/share/nginx/html;
        gzip on;
        gzip_types application/javascript application/json application/wasm;
    }
    location /scene/tiles/ {      # тайли незмінні: нова версія — новий шлях
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://nginx:80;
        proxy_set_header Authorization "Basic ZGl0dG86ZGl0dG8=";   # ditto:ditto
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
